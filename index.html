function animBox(key,fallbackHTML){
  const src=ASSETS[key];
  if(src){
    if(/\.(mp4|webm)(\?|$)/i.test(src)) return '<video class="ob-media" src="'+src+'" autoplay loop muted playsinline></video>';
    return '<img class="ob-media" src="'+src+'" alt="">';
  }
  return fallbackHTML;
}

/* ===================== ONBOARDING ===================== */
const OB_STEPS=["ob-welcome","ob-lang","ob-loc","ob-name"];
let obSelLang=LANG;

function obShow(id){
  $$("#onboard .ob-screen").forEach(s=>s.classList.remove("active"));
  const el=document.getElementById(id);if(!el)return;
  el.classList.add("active");
  // progress dots
  const idx=OB_STEPS.indexOf(id);
  el.querySelectorAll("[data-dots]").forEach(d=>{
    d.innerHTML=OB_STEPS.map((s,i)=>'<i class="'+(i===idx?'on':'')+'"></i>').join("");
  });
}
function obText(){
  // splash
  $("#splash-tag").textContent=I18N[obSelLang].brandSub;
  $("#splash-next").textContent=t("obNext")+" ›››";
  // welcome
  $("#ob-welcome-t").innerHTML=t("obWelcomeT");
  $("#ob-welcome-s").textContent=t("obWelcomeS");
  $("#ob-welcome-btn").textContent=t("obNext");
  // lang
  $("#ob-lang-t").textContent=t("obLangT");
  $("#ob-lang-s").textContent=t("obLangS");
  $("#ob-lang-btn").textContent=t("obNext");
  // loc
  $("#ob-loc-t").textContent=t("obLocT");
  $("#ob-loc-s").textContent=t("obLocS");
  $("#ob-allow-btn").textContent=t("obAllow");
  $("#ob-loc-skip").textContent=t("obLocSkip");
  // name
  $("#ob-name-t").textContent=t("obNameT");
  $("#ob-name-s").textContent=t("obNameS");
  $("#ob-name-in").placeholder=t("obNamePh");
  var _php=$("#ob-phone-in");if(_php)_php.placeholder=t("obPhonePh");
  $("#ob-finish-btn").textContent=t("obFinish");
  $$("#onboard .ob-skip").forEach(b=>b.textContent=t("obSkip"));
  var _c=document.getElementById("ob-consent");if(_c)_c.innerHTML=t("consentPre")+' <button id="ob-legal-link">'+t("consentLink")+'</button>';
  var _cl=document.getElementById("ob-legal-link");if(_cl)_cl.onclick=function(){openLegal("privacy");};
  document.getElementById("onboard").dir=I18N[obSelLang].dir;
}
function obFillAnims(){
  $("#anim-welcome").innerHTML=animBox("welcome",'<span class="ph">🐝</span>');
  $("#anim-lang").innerHTML=animBox("lang",'<span class="ph">🌍</span>');
  $("#anim-location").innerHTML=animBox("location",'<div class="loc-anim"><span class="ring"></span><span class="pin">📍</span></div>');
  $("#anim-name").innerHTML=animBox("name",'<span class="ph">👋</span>');
}
function finishOnboard(){
  store.set("hg_onboarded","1");
  LANG=obSelLang;applyLang();updatePoints();
  const ob=document.getElementById("onboard");
  ob.classList.add("hide");buzz(8);
  setTimeout(()=>{ob.style.display="none";},520);
}

/* splash */
$("#splash-next").onclick=()=>{obShow("ob-welcome");obText();};
setTimeout(()=>{$("#splash-load").style.display="none";$("#splash-next").style.opacity="1";},1250);

/* step navigation */
$$("#onboard [data-go]").forEach(b=>b.onclick=()=>{obShow(b.dataset.go);obText();buzz(5);});
$$("#onboard [data-skip]").forEach(b=>b.onclick=()=>{finishOnboard();buzz(6);});

/* language choice (live preview) */
$$("#ob-langs .ob-lang").forEach(b=>b.onclick=()=>{
  obSelLang=b.dataset.oblang;LANG=obSelLang;
  $$("#ob-langs .ob-lang").forEach(x=>x.classList.toggle("sel",x===b));
  obText();buzz(6);
});

/* allow location during onboarding */
$("#ob-allow-btn").onclick=()=>{
  buzz(8);
  if(!navigator.geolocation){obShow("ob-name");obText();return;}
  $("#ob-allow-btn").innerHTML='<span class="spin dark"></span>';
  navigator.geolocation.getCurrentPosition(pos=>{
    const url="https://maps.google.com/?q="+pos.coords.latitude+","+pos.coords.longitude;
    detectedLoc=url;store.set("hg_location",url);store.set("hg_loc_granted","true");
    $("#ob-allow-btn").textContent=t("obAllow");obShow("ob-name");obText();
  },err=>{
    store.set("hg_loc_granted","false");
    $("#ob-allow-btn").textContent=t("obAllow");obShow("ob-name");obText();
  },{enableHighAccuracy:true,timeout:10000});
};

/* finish + save optional name */
$("#ob-finish-btn").onclick=()=>{
  const v=clean($("#ob-name-in").value,60);
  if(v){user.name=v;saveUser();}
  var _ophone=$("#ob-phone-in");if(_ophone){var ph=clean(_ophone.value,20);if(ph){user.phone=ph;store.set("hg_phone",ph);saveUser();}}
  store.set("hg_consent",String(Date.now()));
  buzz([10,30,10]);finishOnboard();
};

/* cinematic loader: honey spots + minimum 5s hold on every launch */
function initLoader(){
  var sp=document.getElementById("lz-spots");
  if(sp){var cols=["#f5b30f","#e9a13b","#ffce6a","#dd8b00","#ffd98a"];var out="";
    for(var i=0;i<18;i++){var sz=(5+Math.random()*22).toFixed(1);var x=(Math.random()*100).toFixed(1);var y=(Math.random()*100).toFixed(1);
      var dur=(3+Math.random()*4).toFixed(2);var del=(Math.random()*3).toFixed(2);var op=(0.2+Math.random()*0.5).toFixed(2);
      out+='<i style="left:'+x+'%;top:'+y+'%;width:'+sz+'px;height:'+sz+'px;background:'+cols[i%cols.length]+';opacity:'+op+';animation-duration:'+dur+'s;animation-delay:'+del+'s"></i>';}
    sp.innerHTML=out;}
  var ld=document.getElementById("loader");if(!ld)return;
  setTimeout(function(){ld.classList.add("done");setTimeout(function(){ld.style.display="none";},950);},5200);
}


/* ===================== FIREBASE — optional cloud orders =====================
   RODO_Dev: paste your Firebase WEB config below to turn on cloud sync.
   Firebase console > Project settings > Your apps > Web app > "SDK setup and configuration".
   Until apiKey is filled, NONE of this runs — the app stays fully offline
   (localStorage + Formspree). With it filled, every placed order is also written
   to a Firestore "orders" collection so the shop sees orders in real time. */
const FIREBASE={
  apiKey:"", authDomain:"", projectId:"", storageBucket:"", messagingSenderId:"", appId:""
};
const FB_SDK="https://www.gstatic.com/firebasejs/10.12.2/";
let fbDb=null, fbReady=false;
async function initFirebase(){
  if(!FIREBASE.apiKey) return;                 // not configured -> stay offline
  try{
    const {initializeApp}=await import(FB_SDK+"firebase-app.js");
    const {getFirestore}=await import(FB_SDK+"firebase-firestore.js");
    const {getAuth,signInAnonymously}=await import(FB_SDK+"firebase-auth.js");
    const app=initializeApp(FIREBASE);
    fbDb=getFirestore(app);
    try{ await signInAnonymously(getAuth(app)); }catch(e){}
    fbReady=true;
  }catch(e){ /* blocked/offline -> silent fallback to Formspree */ }
}
async function fbSaveOrder(ord){
  if(!fbReady||!fbDb) return false;
  try{
    const {collection,addDoc,serverTimestamp}=await import(FB_SDK+"firebase-firestore.js");
    await addDoc(collection(fbDb,"orders"), Object.assign({},ord,{createdAt:serverTimestamp()}));
    return true;
  }catch(e){ return false; }
}
